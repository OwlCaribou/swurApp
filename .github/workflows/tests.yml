name: Python Tests

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'AGENTS.md'
      - '.gitignore'
      - 'docker-compose.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/workflows/promote-latest.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'AGENTS.md'
      - '.gitignore'
      - 'docker-compose.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/workflows/promote-latest.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
